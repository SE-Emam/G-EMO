name: G-EMO Android build and emulator smoke test

on:
  push:
    branches: [main, 'implementation/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Buildozer host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip             autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev             libtinfo6 cmake libffi-dev libssl-dev automake
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer "Cython==0.29.36"
      - name: Build Android APKs
        env:
          ACCEPT_ANDROID_SDK_LICENSE: "1"
        run: buildozer -v android debug
      - name: Verify APK outputs
        run: |
          test -n "$(find bin -maxdepth 1 -name '*.apk' -print -quit)"
          find bin -maxdepth 1 -name '*.apk' -printf '%f %s bytes\n'
      - uses: actions/upload-artifact@v4
        with:
          name: g-emo-debug-apks
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7

  emulator-smoke:
    needs: build-apk
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: g-emo-debug-apks
          path: apks
      - uses: android-actions/setup-android@v3
      - name: Install emulator platform tools
        run: sdkmanager "platform-tools" "platforms;android-35" "emulator" "system-images;android-35;google_apis;x86_64"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            APK="$(find apks -type f -name '*x86_64*.apk' -print -quit)"
            if [ -z "$APK" ]; then
              echo "BLOCKED: no x86_64 APK was produced. Available APKs:"
              find apks -type f -name '*.apk' -print
              exit 1
            fi
            adb install "$APK"
            adb shell monkey -p com.emam.emo 1
            sleep 12
            adb shell pidof com.emam.emo
            # Private marker opts into a three-launch test using dummy-only credentials.
            adb shell run-as com.emam.emo sh -c 'P="$(find . -name settings.json -print -quit)"; test -n "$P"; touch "$(dirname "$P")/.gemo_android_keystore_self_test"'
            for phase in 1 2 3; do
              adb shell am force-stop com.emam.emo
              adb shell monkey -p com.emam.emo 1
              sleep 12
              adb shell pidof com.emam.emo
            done
            adb shell run-as com.emam.emo sh -c 'P="$(find . -name .gemo_android_keystore_self_test.json -print -quit)"; test -n "$P"; cat "$P"' > android-keystore-self-test.json
            grep -q '"status": "PASS"' android-keystore-self-test.json
            adb shell run-as com.emam.emo sh -c 'P="$(find . -name settings.json -print -quit)"; test -n "$P"; cat "$P"' > android-runtime-settings.json
            if grep -E '"(access_token|webjs_token)"[[:space:]]*:' android-runtime-settings.json; then
              echo "FAIL: legacy plaintext token field found in runtime settings"
              exit 1
            fi
            adb logcat -d > android-emulator-logcat.txt
            if grep -E 'FATAL EXCEPTION|Python traceback|Traceback \(most recent call last\)' android-emulator-logcat.txt; then
              echo "FAIL: application startup error found in logcat"
              exit 1
            fi
            echo "PASS: APK launch, Keystore round-trip, restart persistence, deletion, legacy migration, and plaintext settings inspection."
      - name: Upload emulator logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g-emo-emulator-logcat
          path: |
            android-emulator-logcat.txt
            android-keystore-self-test.json
            android-runtime-settings.json
          if-no-files-found: ignore
          retention-days: 7
