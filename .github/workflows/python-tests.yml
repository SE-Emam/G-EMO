name: G-EMO Python tests
on:
  push:
    branches: [main, 'implementation/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate settings JSON
        run: python -m json.tool config/settings.json >/dev/null
      - name: Run unit tests
        run: python -m unittest discover -v
