name: G-EMO tests
on:
  push:
    branches: [main, 'implementation/**']
  pull_request:
    branches: [main]
concurrency:
  group: g-emo-tests-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate settings JSON
        run: python -m json.tool config/settings.json >/dev/null
      - name: Compile Python entry points
        run: python -m py_compile main.py plugins/whatsapp_plugin.py
      - name: Run Python unit tests
        run: python -m unittest discover -v
  webjs-bridge-static-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/whatsapp-webjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate bridge JavaScript syntax
        run: node --check server.js
      - name: Validate bridge package JSON
        run: node -e 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8"))'
